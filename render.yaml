# Trial only: free web service sleeps, and the free database expires in 30 days.
# Inspect actual account eligibility and pricing before applying this Blueprint.
services:
  - type: web
    name: wmamba-persona-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: wmamba-persona-budget
          property: connectionString
      - key: APP_PUBLIC_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://wmamba0824.github.io
      - key: PERSONA_AI_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
databases:
  - name: wmamba-persona-budget
    plan: free
    region: singapore
    databaseName: persona
    user: persona
